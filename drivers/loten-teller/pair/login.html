<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { padding: 16px; }
    .error { color: #E63929; margin-top: 8px; display: none; }
  </style>
</head>
<body>
  <div class="homey-form-group">
    <label class="homey-form-label" data-i18n="pair.sellerId_label"></label>
    <input class="homey-form-input" type="number" id="sellerId" />
  </div>
  <div class="homey-form-group">
    <label class="homey-form-label" data-i18n="pair.loginCode_label"></label>
    <input class="homey-form-input" type="text" id="loginCode" />
  </div>
  <button class="homey-button-primary-full" id="submit" data-i18n="pair.submit"></button>
  <div class="error" id="error"></div>

  <script type="application/javascript">
    function onHomeyReady(Homey) {
      try {
        Homey.setTitle(Homey.__('pair.title'));
      } catch (e) {
        // Titel is optioneel; blokkeer de rest van de pagina niet als dit faalt
      }

      const errorEl = document.getElementById('error');
      const submitBtn = document.getElementById('submit');

      submitBtn.addEventListener('click', async () => {
        errorEl.style.display = 'none';
        const sellerId = document.getElementById('sellerId').value.trim();
        const loginCode = document.getElementById('loginCode').value.trim();

        if (!sellerId || !loginCode) {
          errorEl.textContent = Homey.__('pair.missing_fields');
          errorEl.style.display = 'block';
          return;
        }

        submitBtn.disabled = true;
        try {
          const device = await Homey.emit('login', { sellerId, loginCode });
          await Homey.createDevice(device);
          Homey.done();
        } catch (err) {
          errorEl.textContent = (err && err.message) ? err.message : String(err);
          errorEl.style.display = 'block';
        } finally {
          submitBtn.disabled = false;
        }
      });

      Homey.ready();
    }
  </script>
</body>
</html>
