<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { padding: 16px; }
    .error { color: #E63929; margin-top: 8px; display: none; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="homey-form-group">
    <label class="homey-form-label" data-i18n="pair.sellerId_label"></label>
    <input class="homey-form-input" type="text" id="salesPageUrl" placeholder="https://lot.clubactie.nl/..." />
  </div>
  <div class="homey-form-group">
    <label class="homey-form-label" data-i18n="pair.loginCode_label"></label>
    <input class="homey-form-input" type="text" id="loginCode" />
  </div>
  <button class="homey-button-primary-full" id="submit" data-i18n="pair.submit"></button>
  <div class="error" id="error"></div>

  <script type="application/javascript">
    function extractSellerId(rawUrl) {
      try {
        const url = new URL(rawUrl.trim());
        const segments = url.pathname.split('/').filter(Boolean);
        const numeric = segments.find((segment) => /^\d+$/.test(segment));
        return numeric || null;
      } catch (e) {
        const trimmed = rawUrl.trim();
        return /^\d+$/.test(trimmed) ? trimmed : null;
      }
    }

    // Workaround voor een bekende Homey-firmwarebug waarbij de officiele
    // onHomeyReady(Homey) callback soms nooit wordt aangeroepen, terwijl
    // window.Homey wel degelijk beschikbaar komt. We initialiseren daarom via
    // welke route ook het eerst beschikbaar is, met een guard tegen dubbel init.
    var __initialized = false;

    function initPairView(Homey) {
      if (__initialized) return;
      __initialized = true;

      try {
        Homey.setTitle(Homey.__('pair.title'));
      } catch (e) {
        // titel is optioneel
      }

      const errorEl = document.getElementById('error');
      const submitBtn = document.getElementById('submit');

      submitBtn.addEventListener('click', async () => {
        errorEl.style.display = 'none';

        const salesPageUrl = document.getElementById('salesPageUrl').value.trim();
        const loginCode = document.getElementById('loginCode').value.trim();

        if (!salesPageUrl || !loginCode) {
          errorEl.textContent = Homey.__('pair.missing_fields');
          errorEl.style.display = 'block';
          return;
        }

        const sellerId = extractSellerId(salesPageUrl);
        if (!sellerId) {
          errorEl.textContent = Homey.__('pair.invalid_url');
          errorEl.style.display = 'block';
          return;
        }

        submitBtn.disabled = true;
        try { Homey.showLoadingOverlay(); } catch (e) {}

        try {
          const device = await Homey.emit('login', { sellerId, loginCode });
          await Homey.createDevice(device);
          Homey.done();
        } catch (err) {
          errorEl.textContent = (err && err.message) ? err.message : String(err);
          errorEl.style.display = 'block';
        } finally {
          submitBtn.disabled = false;
          try { Homey.hideLoadingOverlay(); } catch (e) {}
        }
      });

      Homey.ready();
    }

    function onHomeyReady(Homey) {
      initPairView(Homey);
    }

    var pollAttempts = 0;
    var pollInterval = setInterval(function () {
      pollAttempts++;
      if (window.Homey) {
        clearInterval(pollInterval);
        initPairView(window.Homey);
      } else if (pollAttempts >= 100) {
        clearInterval(pollInterval);
      }
    }, 100);
  </script>
</body>
</html>
